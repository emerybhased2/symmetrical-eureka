<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="593.09309" height="441.44144" viewBox="0,0,593.09309,441.44144"><g transform="translate(56.54639,40.72072)"><g stroke-miterlimit="10"><path d="M-56.54639,400.72072v-441.44144h593.09309v441.44144z" fill-opacity="0.70196" fill="#000000" stroke="none" stroke-width="NaN"/><text transform="translate(188.40555,31.97634) scale(0.5991,0.5991)" font-size="40" xml:space="preserve" fill-opacity="0" fill="#000000" stroke="#173e58" stroke-width="5" font-family="&quot;OETZTYP_&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Hotkeys</tspan></text><text transform="translate(188.40555,31.97634) scale(0.5991,0.5991)" font-size="40" xml:space="preserve" fill="#5dbefd" stroke="none" stroke-width="1" font-family="&quot;OETZTYP_&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Hotkeys</tspan></text><text transform="translate(19.3404,55.00726) scale(0.28391,0.28391)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="&quot;OETZTYP_&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Here are the main hotkeys you can use:</tspan><tspan x="0" dy="46.150000000000006px">Backspace - Sell Selected Tower</tspan><tspan x="0" dy="46.150000000000006px">, - Upgrade Left Path</tspan><tspan x="0" dy="46.150000000000006px">. - Upgrade Right Path</tspan><tspan x="0" dy="46.150000000000006px">/ - Activate Selected Tower's First Ability</tspan><tspan x="0" dy="46.150000000000006px">? - Activate Selected Tower's Second Ability</tspan><tspan x="0" dy="46.150000000000006px">[ - Change Target Priority (Left Arrow)</tspan><tspan x="0" dy="46.150000000000006px">] - Change Target Priority (Right Arrow)</tspan><tspan x="0" dy="46.150000000000006px">Both [ and ] can be used to collect funds from monkey banks and BIAs</tspan><tspan x="0" dy="46.150000000000006px">' - Change Boomerang Throwing Hand or set bloon trap target</tspan><tspan x="0" dy="46.150000000000006px">You can toggle between the pop count, cash generated, lives and extra</tspan><tspan x="0" dy="46.150000000000006px">money generated by clicking the icons</tspan><tspan x="0" dy="46.150000000000006px">Spacebar - Enable and disable fast forward and start the next round</tspan><tspan x="0" dy="46.150000000000006px">Enter - To start the next round</tspan><tspan x="0" dy="46.150000000000006px">= - Enter and exit the settings menu</tspan><tspan x="0" dy="46.150000000000006px">Up and down arrow keys to change between tower menus</tspan><tspan x="0" dy="46.150000000000006px">Left and right arrow keys to change between special agent menus</tspan></text></g></g></svg>