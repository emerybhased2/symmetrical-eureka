<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="95.75" height="218.7844" viewBox="0,0,95.75,218.7844"><g transform="translate(-280.625,-88.47713)"><g stroke-miterlimit="10"><g stroke="#634718"><path d="M281.125,306.76153v-28.39214h81v28.39214z" fill="#231404" stroke-linecap="butt"/><path d="M373.375,292.50001h-11" fill="none" stroke-linecap="round"/></g><text transform="translate(282.375,284.83673) scale(0.13726,0.13726)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-linecap="butt" font-family="&quot;OETZTYP_&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Switch between the tower</tspan><tspan x="0" dy="46.150000000000006px">menu and extra bloon</tspan><tspan x="0" dy="46.150000000000006px">settings.</tspan></text><g stroke="#634718"><path d="M281.125,278.67805v-28.39214h81v28.39214z" fill="#231404" stroke-linecap="butt"/><path d="M373.375,264.41652h-11" fill="none" stroke-linecap="round"/></g><text transform="translate(282.375,256.75325) scale(0.13726,0.13726)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-linecap="butt" font-family="&quot;OETZTYP_&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Delete all towers on</tspan><tspan x="0" dy="46.150000000000006px">screen.</tspan></text><g stroke="#634718"><path d="M281.125,248.71774v-28.39214h81v28.39214z" fill="#231404" stroke-linecap="butt"/><path d="M373.375,234.45625h-11" fill="none" stroke-linecap="round"/></g><text transform="translate(282.375,226.79296) scale(0.13726,0.13726)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-linecap="butt" font-family="&quot;OETZTYP_&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Delete all bloons on</tspan><tspan x="0" dy="46.150000000000006px">screen as well as all yet</tspan><tspan x="0" dy="46.150000000000006px">to spawn ones.</tspan></text><g stroke="#634718"><path d="M281.125,219.08014v-28.39214h81v28.39214z" fill="#231404" stroke-linecap="butt"/><path d="M373.375,204.81863h-11" fill="none" stroke-linecap="round"/></g><text transform="translate(282.375,197.15535) scale(0.13726,0.13726)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-linecap="butt" font-family="&quot;OETZTYP_&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Resets the ability</tspan><tspan x="0" dy="46.150000000000006px">cooldown of the selected</tspan><tspan x="0" dy="46.150000000000006px">tower or all towers if</tspan><tspan x="0" dy="46.150000000000006px">none are selected.</tspan></text><g stroke="#634718"><path d="M281.125,190.10587v-28.39214h81v28.39214z" fill="#231404" stroke-linecap="butt"/><path d="M362.375,175.84436h11" fill="none" stroke-linecap="round"/></g><text transform="translate(282.375,168.18107) scale(0.13726,0.13726)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-linecap="butt" font-family="&quot;OETZTYP_&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Resets all the stats of</tspan><tspan x="0" dy="46.150000000000006px">the selected tower or all</tspan><tspan x="0" dy="46.150000000000006px">towers if none are</tspan><tspan x="0" dy="46.150000000000006px">selected.</tspan></text><g stroke="#634718"><path d="M281.125,161.06475v-28.39214h81v28.39214z" fill="#231404" stroke-linecap="butt"/><path d="M373.375,146.80324h-11" fill="none" stroke-linecap="round"/></g><text transform="translate(282.375,139.13995) scale(0.13726,0.13726)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-linecap="butt" font-family="&quot;OETZTYP_&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Fills the map with a</tspan><tspan x="0" dy="46.150000000000006px">specific tower type. Will</tspan><tspan x="0" dy="46.150000000000006px">cause lag for about 30</tspan><tspan x="0" dy="46.150000000000006px">seconds though.</tspan></text><g stroke="#634718"><path d="M281.125,131.67286v-28.39214h81v28.39214z" fill="#231404" stroke-linecap="butt"/><path d="M373.375,117.41135h-11" fill="none" stroke-linecap="round"/></g><text transform="translate(282.375,109.74806) scale(0.13726,0.13726)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-linecap="butt" font-family="&quot;OETZTYP_&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Allows all towers to be</tspan><tspan x="0" dy="46.150000000000006px">upgraded when you</tspan><tspan x="0" dy="46.150000000000006px">upgrade any tower.</tspan></text><g stroke="#634718"><path d="M283.625,104.35732v-15.38018h81v15.38018z" fill="#231404" stroke-linecap="butt"/><path d="M375.875,96.63177h-11" fill="none" stroke-linecap="round"/></g><text transform="translate(284.875,95.44447) scale(0.13726,0.13726)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-linecap="butt" font-family="&quot;OETZTYP_&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Click this to hide all the</tspan><tspan x="0" dy="46.15px">buttons.</tspan></text></g></g></svg>