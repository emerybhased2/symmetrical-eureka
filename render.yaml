services:
  - type: web
    name: bloons-td5-demo
    runtime: static
    staticPublishPath: ./extracted/bloons-td--demo-v
    headers:
      # Asset filenames are content hashes, so they can be cached forever.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /script.js
        name: Cache-Control
        value: public, max-age=86400
      - path: /sw.js
        name: Cache-Control
        value: no-cache
